<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 296" width="872" height="296" role="img" xml:space="preserve"><title>On the command line, screen 1: Which ports can I use? A plain verdict for every port, and a ready-made command.</title><style>text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:14px;white-space:pre}.bar{font-size:12px;fill:#83919F}</style><g fill="#D3DBE3"><rect x=".5" y=".5" width="871" height="295" rx="10" fill="#0A0F14" stroke="#222C36"/><path d="M1 30 V11 A10 10 0 0 1 11 1 H861 A10 10 0 0 1 871 11 V30 Z" fill="#121920"/><path d="M1 30.5 H871" stroke="#222C36"/><circle cx="20" cy="15" r="4" fill="#74D38A"/><text x="32" y="19" class="bar">root@web01: ~</text><text x="16" y="59.5" textLength="126" fill="#74D38A">[root@web01 ~]#</text><text x="150.4" y="59.5" textLength="142.8">bond-manager nics</text><text x="16" y="77.5" textLength="462">NIC     LINK     SPEED  IN-BOND  ADDRESSES         NOTE</text><text x="16" y="95.5" textLength="411.6">eno1    up       1G     -        192.168.10.21/24</text><text x="444.4" y="95.5" textLength="226.8" fill="#EFC263">has an IP - probably in use</text><text x="16" y="113.5" textLength="285.6">ens1f0  up       10G    bond0    -</text><text x="444.4" y="113.5" textLength="319.2" fill="#EFC263">in bond0 - carries your SSH connection</text><text x="16" y="131.5" textLength="285.6">ens1f1  up       10G    bond0    -</text><text x="444.4" y="131.5" textLength="319.2" fill="#EFC263">in bond0 - carries your SSH connection</text><text x="16" y="149.5" textLength="285.6">ens2f0  up       10G    -        -</text><text x="444.4" y="149.5" textLength="151.2" fill="#74D38A">free - good to use</text><text x="16" y="167.5" textLength="285.6">ens2f1  up       10G    -        -</text><text x="444.4" y="167.5" textLength="151.2" fill="#74D38A">free - good to use</text><text x="16" y="185.5" textLength="495.6">ens3f0  up       10G    bond1    -                 in bond1</text><text x="16" y="203.5" textLength="495.6">ens3f1  up       10G    bond1    -                 in bond1</text><text x="16" y="221.5" textLength="285.6">ens4f0  no link  10G    -        -</text><text x="444.4" y="221.5" textLength="344.4" fill="#EFC263">free, but no link - cable or switch port?</text><text x="16" y="257.5" textLength="621.6">Tip: build a bond from two free ports (preview first, -n changes nothing):</text><text x="32.8" y="275.5" textLength="613.2">bond-manager -n create bond2 --mode active-backup --members ens2f0,ens2f1</text></g></svg>
