text x="16" y="239.5" textLength="831.6">|                                                                                                 |</text><text x="16" y="257.5" textLength="8.4">|</text><text x="32.8" y="257.5" textLength="33.6" fill="#74D38A">[ok]</text><text x="74.8" y="257.5" textLength="772.8">Safety net: automatic undo (NetworkManager)                                                |</text><text x="16" y="275.5" textLength="831.6">+-------------------------------------------------------------------------------------------------+</text><text x="16" y="311.5" textLength="193.2" font-weight="700">What do you want to do?</text><text x="41.2" y="329.5" textLength="394.8">1) Check my bonds  (health, problems explained)</text><text x="41.2" y="347.5" textLength="537.6">2) Move a bond to a new switch  (one cable at a time, no outage)</text><text x="41.2" y="365.5" textLength="159.6">3) Build a new bond</text><text x="41.2" y="383.5" textLength="378">4) Change a bond  (ports, mode, IP, VLANs...)</text><text x="41.2" y="401.5" textLength="252">5) Fix a bond that looks wrong</text><text x="41.2" y="419.5" textLength="411.6">6) Undo &amp; safety  (waiting change, backup copies)</text><text x="41.2" y="437.5" textLength="462">7) Tools  (network ports, server check, support bundle)</text><text x="41.2" y="455.5" textLength="218.4">8) Help: what is all this?</text><text x="41.2" y="473.5" textLength="596.4">9) Practice mode is OFF  (pick to try things without changing anything)</text><text x="32.8" y="491.5" textLength="67.2">10) Quit</text><text x="41.2" y="509.5" textLength="344.4">p) practice on/off   r) refresh   ?) help</text><text x="16" y="527.5" textLength="193.2">Choose 1-10 (q = quit):</text></g></svg>
