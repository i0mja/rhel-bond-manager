<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 440" width="872" height="440" role="img" xml:space="preserve"><title>Build a new bond, screen 3: Step 3: the safe choice comes first. Picking 802.3ad asks whether the switch is ready for LACP.</title><style>text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:14px;white-space:pre}.bar{font-size:12px;fill:#83919F}</style><g fill="#D3DBE3"><rect x=".5" y=".5" width="871" height="439" rx="10" fill="#0A0F14" stroke="#222C36"/><path d="M1 30 V11 A10 10 0 0 1 11 1 H861 A10 10 0 0 1 871 11 V30 Z" fill="#121920"/><path d="M1 30.5 H871" stroke="#222C36"/><circle cx="20" cy="15" r="4" fill="#74D38A"/><text x="32" y="19" class="bar">root@web01: ~</text><rect x="66.4" y="352" width="277.2" height="18" fill="#D3DBE3"/><path d="M16 90.5H32.8M16 162.5H32.8M16 234.5H32.8M16 324.5H32.8" stroke="#6CCFDC" stroke-width="2" fill="none"/><text x="16" y="59.5" textLength="193.2" fill="#6A7887">What do you want to do?</text><text x="221.8" y="59.5" text-anchor="middle">›</text><text x="234.4" y="59.5" textLength="134.4">Build a new bond</text><text x="41.2" y="95.5" textLength="134.4" font-weight="700">Build a new bond</text><text x="32.8" y="113.5" textLength="756">A bond joins two or more network ports into one connection that survives a cable or switch</text><text x="32.8" y="131.5" textLength="453.6">failure. Five short questions; Esc goes back one step.</text><text x="41.2" y="167.5" textLength="33.6" font-weight="700">Name</text><text x="91.6" y="167.5" textLength="92.4" fill="#6A7887">Step 1 of 5</text><text x="32.8" y="185.5" textLength="613.2">The name the server uses for the bond. bond0, bond1... is the convention.</text><text x="16" y="203.5" textLength="75.6" fill="#6A7887">Bond name</text><text x="104.2" y="203.5" text-anchor="middle">›</text><text x="116.8" y="203.5" textLength="42">bond2</text><text x="41.2" y="239.5" textLength="42" font-weight="700">Ports</text><text x="100" y="239.5" textLength="92.4" fill="#6A7887">Step 2 of 5</text><text x="32.8" y="257.5" textLength="739.2">Pick the network ports to join. Two is usual - ideally cabled to two different switches.</text><text x="32.8" y="275.5" textLength="756" fill="#6A7887">Not shown - already in a bond: ens1f0 (bond0) ens1f1 (bond0) ens3f0 (bond1) ens3f1 (bond1)</text><text x="16" y="293.5" textLength="126" fill="#6A7887">Ports for bond2</text><text x="154.6" y="293.5" text-anchor="middle">›</text><text x="167.2" y="293.5" textLength="117.6">ens2f0, ens2f1</text><text x="41.2" y="329.5" textLength="226.8" font-weight="700">How the ports work together</text><text x="284.8" y="329.5" textLength="92.4" fill="#6A7887">Step 3 of 5</text><text x="16" y="347.5" textLength="294" font-weight="700">How should the ports work together?</text><text x="28.6" y="365.5" text-anchor="middle" fill="#6CCFDC">❯</text><text x="41.2" y="365.5" textLength="8.4" fill="#6A7887">1</text><text x="74.8" y="365.5" textLength="260.4" fill="#0A0F14" font-weight="700">active-backup - simple failover</text><text x="360.4" y="365.5" textLength="176.4" fill="#6A7887">recommended if unsure</text><text x="549.4" y="365.5" text-anchor="middle" fill="#6A7887">·</text><text x="562" y="365.5" textLength="84" fill="#6A7887">any switch</text><text x="41.2" y="383.5" textLength="8.4" fill="#6A7887">2</text><text x="74.8" y="383.5" textLength="252">802.3ad - LACP, all ports busy</text><text x="352" y="383.5" textLength="285.6" fill="#6A7887">the switch MUST be set up for LACP</text><text x="41.2" y="401.5" textLength="8.4" fill="#6A7887">3</text><text x="74.8" y="401.5" textLength="210">Other modes (advanced)...</text><text x="28.6" y="419.5" text-anchor="middle" fill="#6A7887">▲</text><text x="37" y="419.5" text-anchor="middle" fill="#6A7887">▼</text><text x="49.6" y="419.5" textLength="33.6" fill="#6A7887">move</text><text x="95.8" y="419.5" text-anchor="middle" fill="#6A7887">·</text><text x="108.4" y="419.5" textLength="100.8" fill="#6A7887">Enter choose</text><text x="221.8" y="419.5" text-anchor="middle" fill="#6A7887">·</text><text x="234.4" y="419.5" textLength="67.2" fill="#6A7887">1-9 jump</text><text x="314.2" y="419.5" text-anchor="middle" fill="#6A7887">·</text><text x="326.8" y="419.5" textLength="67.2" fill="#6A7887">Esc back</text></g></svg>
