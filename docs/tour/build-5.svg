<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 656" width="872" height="656" role="img" xml:space="preserve"><title>Build a new bond, screen 5: The review in plain words, and the command that does the same thing.</title><style>text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:14px;white-space:pre}.bar{font-size:12px;fill:#83919F}</style><g fill="#D3DBE3"><rect x=".5" y=".5" width="871" height="655" rx="10" fill="#0A0F14" stroke="#222C36"/><path d="M1 30 V11 A10 10 0 0 1 11 1 H861 A10 10 0 0 1 871 11 V30 Z" fill="#121920"/><path d="M1 30.5 H871" stroke="#222C36"/><circle cx="20" cy="15" r="4" fill="#74D38A"/><text x="32" y="19" class="bar">root@web01: ~</text><rect x="66.4" y="568" width="294" height="18" fill="#D3DBE3"/><path d="M16 72.5H32.8M16 126.5H32.8M16 270.5H32.8M16 324.5H32.8" stroke="#6CCFDC" stroke-width="2" fill="none"/><path d="M20.5 342.5H32.8M184 342.5H843.5M20.5 486.5H843.5M20.5 342.5V486.5M843.5 342.5V486.5" stroke="#6CCFDC" stroke-width="1" fill="none"/><text x="41.2" y="77.5" textLength="226.8" font-weight="700">How the ports work together</text><text x="284.8" y="77.5" textLength="92.4" fill="#6A7887">Step 3 of 5</text><text x="16" y="95.5" textLength="294" fill="#6A7887">How should the ports work together?</text><text x="322.6" y="95.5" text-anchor="middle">›</text><text x="335.2" y="95.5" textLength="260.4">active-backup - simple failover</text><text x="41.2" y="131.5" textLength="58.8" font-weight="700">Address</text><text x="116.8" y="131.5" textLength="92.4" fill="#6A7887">Step 4 of 5</text><text x="32.8" y="149.5" textLength="781.2">How does this bond get its IPv4 address? Pick "On a VLAN" only if the network team gave you a</text><text x="32.8" y="167.5" textLength="201.6">VLAN id for this server.</text><text x="16" y="185.5" textLength="184.8" fill="#6A7887">IPv4 address for bond2</text><text x="213.4" y="185.5" text-anchor="middle">›</text><text x="226" y="185.5" textLength="109.2">Fixed address</text><text x="16" y="203.5" textLength="159.6" fill="#6A7887">Address with prefix</text><text x="188.2" y="203.5" text-anchor="middle">›</text><text x="200.8" y="203.5" textLength="117.6">10.20.40.10/24</text><text x="16" y="221.5" textLength="277.2" fill="#6A7887">Gateway (router) - Enter for none</text><text x="305.8" y="221.5" text-anchor="middle">›</text><text x="318.4" y="221.5" textLength="84">10.20.40.1</text><text x="16" y="239.5" textLength="235.2" fill="#6A7887">DNS servers - Enter for none</text><text x="263.8" y="239.5" text-anchor="middle">›</text><text x="276.4" y="239.5" textLength="50.4">(none)</text><text x="41.2" y="275.5" textLength="117.6" font-weight="700">Anything else?</text><text x="175.6" y="275.5" textLength="92.4" fill="#6A7887">Step 5 of 5</text><text x="16" y="293.5" textLength="142.8" fill="#6A7887">Extras (optional)</text><text x="171.4" y="293.5" text-anchor="middle">›</text><text x="184" y="293.5" textLength="117.6">No, that's all</text><text x="41.2" y="329.5" textLength="159.6" font-weight="700">Check before you go</text><text x="41.2" y="347.5" textLength="134.4" font-weight="700">You are about to</text><text x="32.8" y="365.5" textLength="310.8">Build bond bond2 from: ens2f0, ens2f1</text><text x="32.8" y="383.5" textLength="756">How it works: active-backup - Simple failover: one port works, the other waits. Works with</text><text x="32.8" y="401.5" textLength="92.4">any switch.</text><text x="32.8" y="419.5" textLength="336">IPv4: 10.20.40.10/24, gateway 10.20.40.1</text><text x="32.8" y="437.5" textLength="596.4">IPv6: not set here - add it afterwards with Change a bond &gt; IP address.</text><text x="32.8" y="473.5" textLength="520.8">PRACTICE: you will see the exact plan, and nothing is changed.</text><text x="32.8" y="509.5" textLength="201.6" fill="#6A7887">Same thing as a command:</text><text x="49.6" y="527.5" textLength="806.4" fill="#6CCFDC">bond-manager -n create bond2 --mode active-backup --members ens2f0,ens2f1 --ip4 10.20.40.10/24 -</text><text x="16" y="545.5" textLength="126" fill="#6CCFDC">-gw4 10.20.40.1</text><text x="16" y="563.5" textLength="50.4" font-weight="700">Ready?</text><text x="28.6" y="581.5" text-anchor="middle" fill="#6CCFDC">❯</text><text x="41.2" y="581.5" textLength="8.4" fill="#6A7887">1</text><text x="74.8" y="581.5" textLength="277.2" fill="#0A0F14" font-weight="700">Continue - show me the exact plan</text><text x="377.2" y="581.5" textLength="277.2" fill="#6A7887">nothing happens until you say yes</text><text x="41.2" y="599.5" textLength="8.4" fill="#6A7887">2</text><text x="74.8" y="599.5" textLength="235.2">Go back and change something</text><text x="41.2" y="617.5" textLength="8.4" fill="#6A7887">3</text><text x="74.8" y="617.5" textLength="50.4">Cancel</text><text x="28.6" y="635.5" text-anchor="middle" fill="#6A7887">▲</text><text x="37" y="635.5" text-anchor="middle" fill="#6A7887">▼</text><text x="49.6" y="635.5" textLength="33.6" fill="#6A7887">move</text><text x="95.8" y="635.5" text-anchor="middle" fill="#6A7887">·</text><text x="108.4" y="635.5" textLength="100.8" fill="#6A7887">Enter choose</text><text x="221.8" y="635.5" text-anchor="middle" fill="#6A7887">·</text><text x="234.4" y="635.5" textLength="67.2" fill="#6A7887">1-9 jump</text><text x="314.2" y="635.5" text-anchor="middle" fill="#6A7887">·</text><text x="326.8" y="635.5" textLength="67.2" fill="#6A7887">Esc back</text></g></svg>
