<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 674" width="872" height="674" role="img" xml:space="preserve"><title>Move to a new switch, screen 5: The exact nmcli commands, in order. Note step 3: it waits until the kernel really uses ens2f0 before step 4 removes ens1f0.</title><style>text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:14px;white-space:pre}.bar{font-size:12px;fill:#83919F}</style><g fill="#D3DBE3"><rect x=".5" y=".5" width="871" height="673" rx="10" fill="#0A0F14" stroke="#222C36"/><path d="M1 30 V11 A10 10 0 0 1 11 1 H861 A10 10 0 0 1 871 11 V30 Z" fill="#121920"/><path d="M1 30.5 H871" stroke="#222C36"/><circle cx="20" cy="15" r="4" fill="#74D38A"/><text x="32" y="19" class="bar">root@web01: ~</text><path d="M16 90.5H32.8" stroke="#6CCFDC" stroke-width="2" fill="none"/><path d="M20.5 108.5H32.8M184 108.5H843.5M20.5 234.5H843.5M20.5 108.5V234.5M843.5 108.5V234.5" stroke="#6CCFDC" stroke-width="1" fill="none"/><text x="16" y="59.5" textLength="151.2" fill="#6A7887">New port for bond0</text><text x="179.8" y="59.5" text-anchor="middle">›</text><text x="192.4" y="59.5" textLength="50.4">ens2f0</text><text x="41.2" y="95.5" textLength="159.6" font-weight="700">Check before you go</text><text x="41.2" y="113.5" textLength="134.4" font-weight="700">You are about to</text><text x="32.8" y="131.5" textLength="327.6">Swap ens1f0 out of bond0 and ens2f0 in.</text><text x="32.8" y="149.5" textLength="638.4">Order: add ens2f0, wait until the kernel really uses it, THEN remove ens1f0.</text><text x="32.8" y="167.5" textLength="294">bond0 keeps working the whole time.</text><text x="32.8" y="203.5" textLength="764.4">Safety net: if you do not confirm, NetworkManager undoes the change by itself - even if the</text><text x="32.8" y="221.5" textLength="235.2">change cuts your connection.</text><text x="32.8" y="257.5" textLength="806.4" fill="#EFC263">! This touches bond0, which carries your SSH connection. If it cuts you off: wait - it is undone</text><text x="32.8" y="275.5" textLength="319.2" fill="#EFC263">automatically, then you can reconnect.</text><text x="32.8" y="293.5" textLength="201.6" fill="#6A7887">Same thing as a command:</text><text x="49.6" y="311.5" textLength="470.4" fill="#6CCFDC">bond-manager swap-member bond0 --old ens1f0 --new ens2f0</text><text x="16" y="329.5" textLength="50.4" fill="#6A7887">Ready?</text><text x="79" y="329.5" text-anchor="middle">›</text><text x="91.6" y="329.5" textLength="277.2">Continue - show me the exact plan</text><text x="16" y="365.5" textLength="554.4" fill="#EFC263">NOTE: this change touches 'bond0', which carries your SSH session.</text><text x="16" y="383.5" textLength="504" fill="#EFC263">NetworkManager will auto-rollback in 120s unless you commit.</text><text x="16" y="401.5" textLength="42">Plan:</text><text x="41.2" y="419.5" textLength="285.6">1. Add replacement member 'ens2f0'</text><text x="66.4" y="437.5" textLength="789.6">$ nmcli connection add type ethernet con-name bond-port-ens2f0 ifname ens2f0 master 11111111-1</text><text x="16" y="455.5" textLength="352.8">111-1111-1111-111111111111 slave-type bond</text><text x="41.2" y="473.5" textLength="226.8">2. Activate member 'ens2f0'</text><text x="66.4" y="491.5" textLength="319.2">$ nmcli connection up bond-port-ens2f0</text><text x="41.2" y="509.5" textLength="260.4">3. Wait for 'ens2f0' to enslave</text><text x="66.4" y="527.5" textLength="352.8">$ (wait until ens2f0 is enslaved to bond0)</text><text x="41.2" y="545.5" textLength="504">4. Remove old member profile for 'ens1f0' (bond-port-ens1f0)</text><text x="66.4" y="563.5" textLength="520.8">$ nmcli connection delete 22222222-2222-2222-2222-222222222222</text><text x="16" y="599.5" textLength="470.4">Protection tier: checkpoint (auto-rollback window: 120s)</text><text x="32.8" y="617.5" textLength="823.2">Safety net: if you do not confirm, NetworkManager undoes the change by itself - even if the change</text><text x="24.4" y="635.5" textLength="176.4">cuts your connection.</text><text x="16" y="653.5" textLength="134.4" font-weight="700">Apply this plan?</text><text x="158.8" y="653.5" textLength="50.4">[y/N]:</text></g></svg>
