<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 674" width="872" height="674" role="img" xml:space="preserve"><title>Build a new bond, screen 6: In practice mode this is where it stops: the exact plan, and nothing changed.</title><style>text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:14px;white-space:pre}.bar{font-size:12px;fill:#83919F}</style><g fill="#D3DBE3"><rect x=".5" y=".5" width="871" height="673" rx="10" fill="#0A0F14" stroke="#222C36"/><path d="M1 30 V11 A10 10 0 0 1 11 1 H861 A10 10 0 0 1 871 11 V30 Z" fill="#121920"/><path d="M1 30.5 H871" stroke="#222C36"/><circle cx="20" cy="15" r="4" fill="#74D38A"/><text x="32" y="19" class="bar">root@web01: ~</text><path d="M20.5 54.5H843.5M20.5 558.5H32.8M100 558.5H843.5M20.5 630.5H843.5M20.5 46V54.5M20.5 558.5V630.5M843.5 46V54.5M843.5 558.5V630.5" stroke="#6CCFDC" stroke-width="1" fill="none"/><text x="32.8" y="77.5" textLength="201.6" fill="#6A7887">Same thing as a command:</text><text x="49.6" y="95.5" textLength="806.4" fill="#6CCFDC">bond-manager -n create bond2 --mode active-backup --members ens2f0,ens2f1 --ip4 10.20.40.10/24 -</text><text x="16" y="113.5" textLength="126" fill="#6CCFDC">-gw4 10.20.40.1</text><text x="16" y="131.5" textLength="50.4" fill="#6A7887">Ready?</text><text x="79" y="131.5" text-anchor="middle">›</text><text x="91.6" y="131.5" textLength="277.2">Continue - show me the exact plan</text><text x="16" y="167.5" textLength="42">Plan:</text><text x="41.2" y="185.5" textLength="520.8">1. Create bond profile 'bond2' (mode=active-backup,miimon=100)</text><text x="66.4" y="203.5" textLength="789.6">$ nmcli connection add type bond con-name bond2 ifname bond2 bond.options mode=active-backup,m</text><text x="16" y="221.5" textLength="411.6">iimon=100 ipv4.method disabled ipv6.method ignore</text><text x="41.2" y="239.5" textLength="184.8">2. Add member 'ens2f0'</text><text x="66.4" y="257.5" textLength="789.6">$ nmcli connection add type ethernet con-name bond-port-ens2f0 ifname ens2f0 master bond2 slav</text><text x="16" y="275.5" textLength="92.4">e-type bond</text><text x="41.2" y="293.5" textLength="184.8">3. Add member 'ens2f1'</text><text x="66.4" y="311.5" textLength="789.6">$ nmcli connection add type ethernet con-name bond-port-ens2f1 ifname ens2f1 master bond2 slav</text><text x="16" y="329.5" textLength="92.4">e-type bond</text><text x="41.2" y="347.5" textLength="361.2">4. Configure IPv4 (10.20.40.10/24) on bond2</text><text x="66.4" y="365.5" textLength="781.2">$ nmcli connection modify bond2 ipv4.method manual ipv4.addresses 10.20.40.10/24 ipv4.gateway</text><text x="16" y="383.5" textLength="84">10.20.40.1</text><text x="41.2" y="401.5" textLength="201.6">5. Activate bond 'bond2'</text><text x="66.4" y="419.5" textLength="226.8">$ nmcli connection up bond2</text><text x="41.2" y="437.5" textLength="226.8">6. Activate member 'ens2f0'</text><text x="66.4" y="455.5" textLength="319.2">$ nmcli connection up bond-port-ens2f0</text><text x="41.2" y="473.5" textLength="226.8">7. Activate member 'ens2f1'</text><text x="66.4" y="491.5" textLength="319.2">$ nmcli connection up bond-port-ens2f1</text><text x="16" y="527.5" textLength="571.2">(dry-run: no commands executed, no files written, no snapshot taken)</text><text x="41.2" y="563.5" textLength="50.4" font-weight="700">Result</text><text x="37" y="581.5" text-anchor="middle" font-weight="700">·</text><text x="49.6" y="581.5" textLength="369.6" font-weight="700">Practice run finished - nothing was changed.</text><text x="32.8" y="599.5" textLength="420">The plan above is exactly what would run for real.</text><text x="32.8" y="617.5" textLength="529.2">To do it for real: switch practice mode off (key p) and repeat.</text><text x="16" y="653.5" textLength="184.8" fill="#6A7887">Press Enter to go back</text></g></svg>
