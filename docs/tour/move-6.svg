<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 638" width="872" height="638" role="img" xml:space="preserve"><title>Move to a new switch, screen 6: A backup copy is taken, the safety net is armed, the change runs and is checked against the kernel. Then it waits for you. If the change had cut your connection, doing nothing would undo it.</title><style>text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:14px;white-space:pre}.bar{font-size:12px;fill:#83919F}</style><g fill="#D3DBE3"><rect x=".5" y=".5" width="871" height="637" rx="10" fill="#0A0F14" stroke="#222C36"/><path d="M1 30 V11 A10 10 0 0 1 11 1 H861 A10 10 0 0 1 871 11 V30 Z" fill="#121920"/><path d="M1 30.5 H871" stroke="#222C36"/><circle cx="20" cy="15" r="4" fill="#74D38A"/><text x="32" y="19" class="bar">root@web01: ~</text><path d="M20.5 468.5H32.8M192.4 468.5H843.5M20.5 594.5H843.5M20.5 468.5V594.5M843.5 468.5V594.5" stroke="#74D38A" stroke-width="1" fill="none"/><text x="41.2" y="59.5" textLength="260.4">3. Wait for 'ens2f0' to enslave</text><text x="66.4" y="77.5" textLength="352.8">$ (wait until ens2f0 is enslaved to bond0)</text><text x="41.2" y="95.5" textLength="504">4. Remove old member profile for 'ens1f0' (bond-port-ens1f0)</text><text x="66.4" y="113.5" textLength="520.8">$ nmcli connection delete 22222222-2222-2222-2222-222222222222</text><text x="16" y="149.5" textLength="470.4">Protection tier: checkpoint (auto-rollback window: 120s)</text><text x="32.8" y="167.5" textLength="823.2">Safety net: if you do not confirm, NetworkManager undoes the change by itself - even if the change</text><text x="24.4" y="185.5" textLength="176.4">cuts your connection.</text><text x="16" y="203.5" textLength="134.4" font-weight="700">Apply this plan?</text><text x="158.8" y="203.5" textLength="67.2">[y/N]: y</text><text x="16" y="221.5" textLength="210">snapshot: 20260925-134631</text><text x="32.8" y="239.5" textLength="310.8">[1/4] Add replacement member 'ens2f0'</text><text x="32.8" y="257.5" textLength="252">[2/4] Activate member 'ens2f0'</text><text x="32.8" y="275.5" textLength="285.6">[3/4] Wait for 'ens2f0' to enslave</text><text x="32.8" y="293.5" textLength="529.2">[4/4] Remove old member profile for 'ens1f0' (bond-port-ens1f0)</text><text x="16" y="329.5" textLength="109.2">Verification:</text><text x="16" y="347.5" textLength="8.4">[</text><text x="41.2" y="347.5" textLength="16.8" fill="#74D38A">ok</text><text x="74.8" y="347.5" textLength="260.4">] bond 'bond0' exists in kernel</text><text x="16" y="365.5" textLength="8.4">[</text><text x="41.2" y="365.5" textLength="16.8" fill="#74D38A">ok</text><text x="74.8" y="365.5" textLength="252">] bond 'bond0' operstate is up</text><text x="16" y="383.5" textLength="8.4">[</text><text x="41.2" y="383.5" textLength="16.8" fill="#74D38A">ok</text><text x="74.8" y="383.5" textLength="386.4">] member ens1f0 is no longer enslaved to bond0</text><text x="16" y="401.5" textLength="8.4">[</text><text x="41.2" y="401.5" textLength="16.8" fill="#74D38A">ok</text><text x="74.8" y="401.5" textLength="268.8">] member ens2f0 enslaved, MII up</text><text x="16" y="419.5" textLength="8.4">[</text><text x="41.2" y="419.5" textLength="16.8" fill="#74D38A">ok</text><text x="74.8" y="419.5" textLength="210">] active member is ens1f1</text><text x="41.2" y="473.5" textLength="142.8" font-weight="700">Keep this change?</text><text x="37" y="491.5" text-anchor="middle" fill="#74D38A">✔︎</text><text x="49.6" y="491.5" textLength="336" fill="#74D38A">All checks passed - your change is live.</text><text x="32.8" y="527.5" textLength="579.6">If you do nothing, it is UNDONE automatically when the time runs out.</text><text x="32.8" y="545.5" textLength="588">That is the safety net: if this change cut your connection, just wait.</text><text x="49.6" y="581.5" textLength="462">K  keep it       U  undo it now       E  5 more minutes</text><text x="16" y="617.5" textLength="142.8" font-weight="700">Keep this change?</text><text x="175.6" y="617.5" textLength="336">[K]eep  [U]ndo  [E]+5 min   Auto-undo in</text><text x="520" y="617.5" textLength="33.6" fill="#74D38A" font-weight="700">1:59</text></g></svg>
