<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 656" width="872" height="656" role="img" xml:space="preserve"><title>Move to a new switch, screen 4: Nothing has happened yet. You pressed 2 for ens2f0. The summary says what will happen in plain words, warns that bond0 carries your SSH session, and shows the same thing as a command you can paste into a runbook.</title><style>text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:14px;white-space:pre}.bar{font-size:12px;fill:#83919F}</style><g fill="#D3DBE3"><rect x=".5" y=".5" width="871" height="655" rx="10" fill="#0A0F14" stroke="#222C36"/><path d="M1 30 V11 A10 10 0 0 1 11 1 H861 A10 10 0 0 1 871 11 V30 Z" fill="#121920"/><path d="M1 30.5 H871" stroke="#222C36"/><circle cx="20" cy="15" r="4" fill="#74D38A"/><text x="32" y="19" class="bar">root@web01: ~</text><rect x="66.4" y="568" width="294" height="18" fill="#D3DBE3"/><path d="M16 54.5H32.8M16 162.5H32.8M16 234.5H32.8M16 324.5H32.8" stroke="#6CCFDC" stroke-width="2" fill="none"/><path d="M20.5 342.5H32.8M184 342.5H843.5M20.5 468.5H843.5M20.5 342.5V468.5M843.5 342.5V468.5" stroke="#6CCFDC" stroke-width="1" fill="none"/><text x="41.2" y="59.5" textLength="226.8" font-weight="700">Move a bond to a new switch</text><text x="32.8" y="77.5" textLength="789.6">A bond keeps working when one cable is gone, so you move one cable at a time: plug a free port</text><text x="32.8" y="95.5" textLength="806.4">into the new switch, then swap it in for an old port. The new port is added and must really work</text><text x="32.8" y="113.5" textLength="588">BEFORE the old one is removed - the server never loses its connection.</text><text x="16" y="131.5" textLength="218.4" fill="#6A7887">Which bond are you moving?</text><text x="247" y="131.5" text-anchor="middle">›</text><text x="259.6" y="131.5" textLength="42">bond0</text><text x="41.2" y="167.5" textLength="151.2" font-weight="700">Which cable moves?</text><text x="209.2" y="167.5" textLength="92.4" fill="#6A7887">Step 1 of 3</text><text x="32.8" y="185.5" textLength="445.2">Pick the port whose cable is still on the OLD switch.</text><text x="16" y="203.5" textLength="126" fill="#6A7887">Port to replace</text><text x="154.6" y="203.5" text-anchor="middle">›</text><text x="167.2" y="203.5" textLength="50.4">ens1f0</text><text x="41.2" y="239.5" textLength="193.2" font-weight="700">Which port replaces it?</text><text x="251.2" y="239.5" textLength="92.4" fill="#6A7887">Step 2 of 3</text><text x="32.8" y="257.5" textLength="470.4">Pick the free port that is now cabled to the NEW switch.</text><text x="32.8" y="275.5" textLength="630" fill="#6A7887">Not shown - already in a bond: ens1f1 (bond0) ens3f0 (bond1) ens3f1 (bond1)</text><text x="16" y="293.5" textLength="151.2" fill="#6A7887">New port for bond0</text><text x="179.8" y="293.5" text-anchor="middle">›</text><text x="192.4" y="293.5" textLength="50.4">ens2f0</text><text x="41.2" y="329.5" textLength="159.6" font-weight="700">Check before you go</text><text x="41.2" y="347.5" textLength="134.4" font-weight="700">You are about to</text><text x="32.8" y="365.5" textLength="327.6">Swap ens1f0 out of bond0 and ens2f0 in.</text><text x="32.8" y="383.5" textLength="638.4">Order: add ens2f0, wait until the kernel really uses it, THEN remove ens1f0.</text><text x="32.8" y="401.5" textLength="294">bond0 keeps working the whole time.</text><text x="32.8" y="437.5" textLength="764.4">Safety net: if you do not confirm, NetworkManager undoes the change by itself - even if the</text><text x="32.8" y="455.5" textLength="235.2">change cuts your connection.</text><text x="32.8" y="491.5" textLength="806.4" fill="#EFC263">! This touches bond0, which carries your SSH connection. If it cuts you off: wait - it is undone</text><text x="32.8" y="509.5" textLength="319.2" fill="#EFC263">automatically, then you can reconnect.</text><text x="32.8" y="527.5" textLength="201.6" fill="#6A7887">Same thing as a command:</text><text x="49.6" y="545.5" textLength="470.4" fill="#6CCFDC">bond-manager swap-member bond0 --old ens1f0 --new ens2f0</text><text x="16" y="563.5" textLength="50.4" font-weight="700">Ready?</text><text x="28.6" y="581.5" text-anchor="middle" fill="#6CCFDC">❯</text><text x="41.2" y="581.5" textLength="8.4" fill="#6A7887">1</text><text x="74.8" y="581.5" textLength="277.2" fill="#0A0F14" font-weight="700">Continue - show me the exact plan</text><text x="377.2" y="581.5" textLength="277.2" fill="#6A7887">nothing happens until you say yes</text><text x="41.2" y="599.5" textLength="8.4" fill="#6A7887">2</text><text x="74.8" y="599.5" textLength="235.2">Go back and change something</text><text x="41.2" y="617.5" textLength="8.4" fill="#6A7887">3</text><text x="74.8" y="617.5" textLength="50.4">Cancel</text><text x="28.6" y="635.5" text-anchor="middle" fill="#6A7887">▲</text><text x="37" y="635.5" text-anchor="middle" fill="#6A7887">▼</text><text x="49.6" y="635.5" textLength="33.6" fill="#6A7887">move</text><text x="95.8" y="635.5" text-anchor="middle" fill="#6A7887">·</text><text x="108.4" y="635.5" textLength="100.8" fill="#6A7887">Enter choose</text><text x="221.8" y="635.5" text-anchor="middle" fill="#6A7887">·</text><text x="234.4" y="635.5" textLength="67.2" fill="#6A7887">1-9 jump</text><text x="314.2" y="635.5" text-anchor="middle" fill="#6A7887">·</text><text x="326.8" y="635.5" textLength="67.2" fill="#6A7887">Esc back</text></g></svg>
