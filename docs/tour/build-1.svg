<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 260" width="872" height="260" role="img" xml:space="preserve"><title>Build a new bond, screen 1: Step 1 suggests the next free name. Esc always goes back one step.</title><style>text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:14px;white-space:pre}.bar{font-size:12px;fill:#83919F}</style><g fill="#D3DBE3"><rect x=".5" y=".5" width="871" height="259" rx="10" fill="#0A0F14" stroke="#222C36"/><path d="M1 30 V11 A10 10 0 0 1 11 1 H861 A10 10 0 0 1 871 11 V30 Z" fill="#121920"/><path d="M1 30.5 H871" stroke="#222C36"/><circle cx="20" cy="15" r="4" fill="#74D38A"/><text x="32" y="19" class="bar">root@web01: ~</text><rect x="91.6" y="208" width="8.4" height="18" fill="#D3DBE3"/><path d="M16 90.5H32.8M16 162.5H32.8" stroke="#6CCFDC" stroke-width="2" fill="none"/><text x="16" y="59.5" textLength="193.2" fill="#6A7887">What do you want to do?</text><text x="221.8" y="59.5" text-anchor="middle">›</text><text x="234.4" y="59.5" textLength="134.4">Build a new bond</text><text x="41.2" y="95.5" textLength="134.4" font-weight="700">Build a new bond</text><text x="32.8" y="113.5" textLength="756">A bond joins two or more network ports into one connection that survives a cable or switch</text><text x="32.8" y="131.5" textLength="453.6">failure. Five short questions; Esc goes back one step.</text><text x="41.2" y="167.5" textLength="33.6" font-weight="700">Name</text><text x="91.6" y="167.5" textLength="92.4" fill="#6A7887">Step 1 of 5</text><text x="32.8" y="185.5" textLength="613.2">The name the server uses for the bond. bond0, bond1... is the convention.</text><text x="16" y="203.5" textLength="75.6" font-weight="700">Bond name</text><text x="37" y="221.5" text-anchor="middle" fill="#6CCFDC">›</text><text x="49.6" y="221.5" textLength="42">bond2</text><text x="32.8" y="239.5" textLength="67.2" fill="#6A7887">Enter OK</text><text x="112.6" y="239.5" text-anchor="middle" fill="#6A7887">·</text><text x="125.2" y="239.5" textLength="67.2" fill="#6A7887">Esc back</text></g></svg>
