<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 422" width="872" height="422" role="img" xml:space="preserve"><title>Check my bonds, screen 2: Each problem comes with what it means and what to do. Here the switch ports behind bond1 were never set up as an LACP bundle.</title><style>text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:14px;white-space:pre}.bar{font-size:12px;fill:#83919F}</style><g fill="#D3DBE3"><rect x=".5" y=".5" width="871" height="421" rx="10" fill="#0A0F14" stroke="#222C36"/><path d="M1 30 V11 A10 10 0 0 1 11 1 H861 A10 10 0 0 1 871 11 V30 Z" fill="#121920"/><path d="M1 30.5 H871" stroke="#222C36"/><circle cx="20" cy="15" r="4" fill="#74D38A"/><text x="32" y="19" class="bar">root@web01: ~</text><path d="M16 90.5H32.8" stroke="#6CCFDC" stroke-width="2" fill="none"/><text x="16" y="59.5" textLength="193.2" fill="#6A7887">What do you want to do?</text><text x="221.8" y="59.5" text-anchor="middle">›</text><text x="234.4" y="59.5" textLength="117.6">Check my bonds</text><text x="41.2" y="95.5" textLength="117.6" font-weight="700">Check my bonds</text><text x="16" y="113.5" textLength="226.8" fill="#6A7887">What would you like to see?</text><text x="255.4" y="113.5" text-anchor="middle">›</text><text x="268" y="113.5" textLength="252">Quick health check (all bonds)</text><text x="20.2" y="149.5" text-anchor="middle" fill="#74D38A">✔︎</text><text x="32.8" y="149.5" textLength="142.8">bond0 is healthy.</text><text x="49.6" y="167.5" textLength="789.6">mode: active-backup - Simple failover: one port works, the other waits. Works with any switch.</text><text x="49.6" y="185.5" textLength="176.4">ports: ens1f0, ens1f1</text><text x="16" y="221.5" textLength="8.4" fill="#EFC263">!</text><text x="32.8" y="221.5" textLength="184.8">bond1 needs attention:</text><text x="49.6" y="239.5" textLength="688.8">mode: 802.3ad - LACP: all ports carry traffic. The switch MUST be set up for LACP.</text><text x="49.6" y="257.5" textLength="176.4">ports: ens3f0, ens3f1</text><text x="49.6" y="275.5" textLength="739.2">- The switch is not answering LACP: its ports are probably not set up as an LACP bundle.</text><text x="66.4" y="293.5" textLength="789.6">What to do: Ask the network team for an LACP port-channel on these switch ports, or use active</text><text x="16" y="311.5" textLength="67.2">-backup.</text><text x="49.6" y="329.5" textLength="781.2">- LACP talks to the switch but cannot agree - often ports split across two separate switches.</text><text x="66.4" y="347.5" textLength="739.2">What to do: Check the switch port-channel. During a switch migration, use active-backup.</text><text x="16" y="401.5" textLength="184.8" fill="#6A7887">Press Enter to go back</text></g></svg>
