<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 134" width="872" height="134" role="img" xml:space="preserve"><title>On the command line, screen 3: Unknown commands get a suggestion by meaning, not only by spelling.</title><style>text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:14px;white-space:pre}.bar{font-size:12px;fill:#83919F}</style><g fill="#D3DBE3"><rect x=".5" y=".5" width="871" height="133" rx="10" fill="#0A0F14" stroke="#222C36"/><path d="M1 30 V11 A10 10 0 0 1 11 1 H861 A10 10 0 0 1 871 11 V30 Z" fill="#121920"/><path d="M1 30.5 H871" stroke="#222C36"/><circle cx="20" cy="15" r="4" fill="#74D38A"/><text x="32" y="19" class="bar">root@web01: ~</text><text x="16" y="59.5" textLength="126" fill="#74D38A">[root@web01 ~]#</text><text x="150.4" y="59.5" textLength="142.8">bond-manager move</text><text x="16" y="77.5" textLength="302.4">bond-manager: unknown command "move"</text><text x="32.8" y="95.5" textLength="319.2">Did you mean: bond-manager swap-member</text><text x="32.8" y="113.5" textLength="739.2">See every command: bond-manager help   (or run bond-manager with no arguments for menus)</text></g></svg>
