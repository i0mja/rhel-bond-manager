<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 242" width="872" height="242" role="img" xml:space="preserve"><title>Move to a new switch, screen 1: The wizard explains the idea first: the new port is added and must really work before the old one is removed.</title><style>text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:14px;white-space:pre}.bar{font-size:12px;fill:#83919F}</style><g fill="#D3DBE3"><rect x=".5" y=".5" width="871" height="241" rx="10" fill="#0A0F14" stroke="#222C36"/><path d="M1 30 V11 A10 10 0 0 1 11 1 H861 A10 10 0 0 1 871 11 V30 Z" fill="#121920"/><path d="M1 30.5 H871" stroke="#222C36"/><circle cx="20" cy="15" r="4" fill="#74D38A"/><text x="32" y="19" class="bar">root@web01: ~</text><rect x="66.4" y="172" width="58.8" height="18" fill="#D3DBE3"/><path d="M16 90.5H32.8" stroke="#6CCFDC" stroke-width="2" fill="none"/><text x="16" y="59.5" textLength="193.2" fill="#6A7887">What do you want to do?</text><text x="221.8" y="59.5" text-anchor="middle">›</text><text x="234.4" y="59.5" textLength="226.8">Move a bond to a new switch</text><text x="41.2" y="95.5" textLength="226.8" font-weight="700">Move a bond to a new switch</text><text x="32.8" y="113.5" textLength="789.6">A bond keeps working when one cable is gone, so you move one cable at a time: plug a free port</text><text x="32.8" y="131.5" textLength="806.4">into the new switch, then swap it in for an old port. The new port is added and must really work</text><text x="32.8" y="149.5" textLength="588">BEFORE the old one is removed - the server never loses its connection.</text><text x="16" y="167.5" textLength="218.4" font-weight="700">Which bond are you moving?</text><text x="28.6" y="185.5" text-anchor="middle" fill="#6CCFDC">❯</text><text x="41.2" y="185.5" textLength="8.4" fill="#6A7887">1</text><text x="74.8" y="185.5" textLength="42" fill="#0A0F14" font-weight="700">bond0</text><text x="142" y="185.5" textLength="109.2" fill="#6A7887">active-backup</text><text x="263.8" y="185.5" text-anchor="middle" fill="#6A7887">·</text><text x="276.4" y="185.5" textLength="58.8" fill="#6A7887">healthy</text><text x="347.8" y="185.5" text-anchor="middle" fill="#6A7887">·</text><text x="360.4" y="185.5" textLength="176.4" fill="#6A7887">ports: ens1f0, ens1f1</text><text x="549.4" y="185.5" text-anchor="middle" fill="#6A7887">·</text><text x="562" y="185.5" textLength="159.6" fill="#6A7887">your SSH connection</text><text x="41.2" y="203.5" textLength="8.4" fill="#6A7887">2</text><text x="74.8" y="203.5" textLength="42">bond1</text><text x="142" y="203.5" textLength="58.8" fill="#6A7887">802.3ad</text><text x="213.4" y="203.5" text-anchor="middle" fill="#6A7887">·</text><text x="226" y="203.5" textLength="126" fill="#6A7887">needs attention</text><text x="364.6" y="203.5" text-anchor="middle" fill="#6A7887">·</text><text x="377.2" y="203.5" textLength="176.4" fill="#6A7887">ports: ens3f0, ens3f1</text><text x="28.6" y="221.5" text-anchor="middle" fill="#6A7887">▲</text><text x="37" y="221.5" text-anchor="middle" fill="#6A7887">▼</text><text x="49.6" y="221.5" textLength="33.6" fill="#6A7887">move</text><text x="95.8" y="221.5" text-anchor="middle" fill="#6A7887">·</text><text x="108.4" y="221.5" textLength="100.8" fill="#6A7887">Enter choose</text><text x="221.8" y="221.5" text-anchor="middle" fill="#6A7887">·</text><text x="234.4" y="221.5" textLength="67.2" fill="#6A7887">1-9 jump</text><text x="314.2" y="221.5" text-anchor="middle" fill="#6A7887">·</text><text x="326.8" y="221.5" textLength="67.2" fill="#6A7887">Esc back</text></g></svg>
