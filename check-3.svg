<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 674" width="872" height="674" role="img" xml:space="preserve"><title>Check my bonds, screen 3: The list of network ports says, for each one, whether you can use it.</title><style>text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:14px;white-space:pre}.bar{font-size:12px;fill:#83919F}</style><g fill="#D3DBE3"><rect x=".5" y=".5" width="871" height="673" rx="10" fill="#0A0F14" stroke="#222C36"/><path d="M1 30 V11 A10 10 0 0 1 11 1 H861 A10 10 0 0 1 871 11 V30 Z" fill="#121920"/><path d="M1 30.5 H871" stroke="#222C36"/><circle cx="20" cy="15" r="4" fill="#74D38A"/><text x="32" y="19" class="bar">root@web01: ~</text><path d="M16 360.5H32.8" stroke="#6CCFDC" stroke-width="2" fill="none"/><text x="16" y="59.5" textLength="226.8" fill="#6A7887">What would you like to see?</text><text x="255.4" y="59.5" text-anchor="middle">›</text><text x="268" y="59.5" textLength="252">Quick health check (all bonds)</text><text x="20.2" y="95.5" text-anchor="middle" fill="#74D38A">✔︎</text><text x="32.8" y="95.5" textLength="142.8">bond0 is healthy.</text><text x="49.6" y="113.5" textLength="789.6">mode: active-backup - Simple failover: one port works, the other waits. Works with any switch.</text><text x="49.6" y="131.5" textLength="176.4">ports: ens1f0, ens1f1</text><text x="16" y="167.5" textLength="8.4" fill="#EFC263">!</text><text x="32.8" y="167.5" textLength="184.8">bond1 needs attention:</text><text x="49.6" y="185.5" textLength="688.8">mode: 802.3ad - LACP: all ports carry traffic. The switch MUST be set up for LACP.</text><text x="49.6" y="203.5" textLength="176.4">ports: ens3f0, ens3f1</text><text x="49.6" y="221.5" textLength="739.2">- The switch is not answering LACP: its ports are probably not set up as an LACP bundle.</text><text x="66.4" y="239.5" textLength="789.6">What to do: Ask the network team for an LACP port-channel on these switch ports, or use active</text><text x="16" y="257.5" textLength="67.2">-backup.</text><text x="49.6" y="275.5" textLength="781.2">- LACP talks to the switch but cannot agree - often ports split across two separate switches.</text><text x="66.4" y="293.5" textLength="739.2">What to do: Check the switch port-channel. During a switch migration, use active-backup.</text><text x="41.2" y="365.5" textLength="117.6" font-weight="700">Check my bonds</text><text x="16" y="383.5" textLength="226.8" fill="#6A7887">What would you like to see?</text><text x="255.4" y="383.5" text-anchor="middle">›</text><text x="268" y="383.5" textLength="184.8">List the network ports</text><text x="16" y="419.5" textLength="462">NIC     LINK     SPEED  IN-BOND  ADDRESSES         NOTE</text><text x="16" y="437.5" textLength="411.6">eno1    up       1G     -        192.168.10.21/24</text><text x="444.4" y="437.5" textLength="226.8" fill="#EFC263">has an IP - probably in use</text><text x="16" y="455.5" textLength="285.6">ens1f0  up       10G    bond0    -</text><text x="444.4" y="455.5" textLength="319.2" fill="#EFC263">in bond0 - carries your SSH connection</text><text x="16" y="473.5" textLength="285.6">ens1f1  up       10G    bond0    -</text><text x="444.4" y="473.5" textLength="319.2" fill="#EFC263">in bond0 - carries your SSH connection</text><text x="16" y="491.5" textLength="285.6">ens2f0  up       10G    -        -</text><text x="444.4" y="491.5" textLength="151.2" fill="#74D38A">free - good to use</text><text x="16" y="509.5" textLength="285.6">ens2f1  up       10G    -        -</text><text x="444.4" y="509.5" textLength="151.2" fill="#74D38A">free - good to use</text><text x="16" y="527.5" textLength="495.6">ens3f0  up       10G    bond1    -                 in bond1</text><text x="16" y="545.5" textLength="495.6">ens3f1  up       10G    bond1    -                 in bond1</text><text x="16" y="563.5" textLength="285.6">ens4f0  no link  10G    -        -</text><text x="444.4" y="563.5" textLength="344.4" fill="#EFC263">free, but no link - cable or switch port?</text><text x="16" y="599.5" textLength="621.6">Tip: build a bond from two free ports (preview first, -n changes nothing):</text><text x="32.8" y="617.5" textLength="613.2">bond-manager -n create bond2 --mode active-backup --members ens2f0,ens2f1</text><text x="16" y="653.5" textLength="184.8" fill="#6A7887">Press Enter to go back</text></g></svg>
