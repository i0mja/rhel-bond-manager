name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: Lint
        run: make lint
      - name: Verify committed artifact matches sources
        run: make check-dist

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats jq
      - name: Test (unprivileged)
        run: make test
      # The snapshot and checkpoint suites need euid 0 and skip themselves
      # otherwise, which would silently leave the safety engine untested.
      - name: Test (root)
        run: sudo --preserve-env=PATH make test

  # RHEL 8 ships bash 4.4 and the code must run there, but the runner's own
  # bash is 5.x. Build 4.4.18 (Ubuntu's upstream tarball) and run the whole
  # suite on it — the tool, its test stubs and bats all resolve `bash` via
  # PATH, so they all run on 4.4.
  test-bash44:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats jq
      - name: Build bash 4.4.18
        run: |
          curl -sSfL -o /tmp/bash-4.4.18.tar.xz \
            http://archive.ubuntu.com/ubuntu/pool/main/b/bash/bash_4.4.18.orig.tar.xz
          tar -C /tmp -xf /tmp/bash-4.4.18.tar.xz
          cd /tmp/bash-4.4.18
          ./configure --prefix=/opt/bash44 --without-bash-malloc >/dev/null
          make -j"$(nproc)" >/dev/null
          sudo make install >/dev/null
          PATH="/opt/bash44/bin:$PATH" bash -c \
            '[[ "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}" == 4.4 ]] && echo "using bash $BASH_VERSION"'
      - name: Test on bash 4.4 (unprivileged)
        run: PATH="/opt/bash44/bin:$PATH" make test
      - name: Test on bash 4.4 (root)
        run: sudo env PATH="/opt/bash44/bin:$PATH" make test
